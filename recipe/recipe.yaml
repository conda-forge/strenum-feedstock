schema_version: 1

context:
  name: StrEnum
  version: "0.5.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | lower }}-${{ version }}.tar.gz
  sha256: 9c50a5ce647c0a625ac25c1b719039e745466b6a04bd001aee6376381d8cdce7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - pytest-runner
    - setuptools
    - versioneer
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - strenum
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  license: MIT
  license_file: LICENSE
  summary: A Python Enum that inherits from str.
  description: |
    A Python Enum that inherits from str.


  homepage: https://github.com/irgeek/StrEnum

extra:
  recipe-maintainers:
    - timkpaine
